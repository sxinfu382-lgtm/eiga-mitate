<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="写真を一枚添付するだけで使えるChatGPT用の写真編集プロンプト。">
<title>写真仕上げ工房｜蝉時雨</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#34453b;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.9}main{max-width:780px;margin:auto;padding:52px 22px 75px}.eyebrow{font-size:.8rem;letter-spacing:.18em;color:#78897d}h1{font-size:clamp(2rem,5vw,3rem);font-weight:500;margin:.25em 0}.lead{font-size:1.12rem}.hero{border-left:3px solid #91a595;padding:5px 0 5px 20px;margin:28px 0 36px}.panel{background:#fffefa;border:1px solid #e2e1d5;border-radius:15px;padding:25px;margin:20px 0}h2{font-size:1.2rem;font-weight:500;margin:0 0 10px}button{cursor:pointer;border:0;border-radius:10px;background:#456b56;color:white;padding:15px 22px;font-size:1rem;font-weight:bold;width:100%;margin:10px 0}button:focus-visible,a:focus-visible{outline:3px solid #92aa98}a{color:#365d47}#status{min-height:1.6em;color:#365d47}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:330px;overflow:auto;font-size:.84rem;background:#f7f7f0;padding:15px}summary{cursor:pointer}footer{margin-top:35px;font-size:.85rem;color:#738276}#preview{box-sizing:border-box;width:100%;min-height:16rem;margin-top:.8em;padding:15px;border:1px solid #d7ddd3;border-radius:8px;color:inherit;background:#fffefa;font:inherit;resize:vertical}li+li{margin-top:.4em}</style>
<style>.open-chat{display:block;text-align:center;padding:12px;border:1px solid #456b56;border-radius:10px;font-weight:bold;text-decoration:none}</style>
</head>
<body>
<main>
<div class="eyebrow">蝉時雨｜創作の小さな道具箱</div>
<h1>写真仕上げ工房</h1>
<div class="hero">写真を一枚渡すだけ。何を見せたい写真かを読み取り、自然な一枚に仕上げます。</div>
<section class="panel">
<button id="copy" type="button">1. プロンプトをコピー</button>
<a class="open-chat" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">2. ChatGPTを開く ↗</a>
<p id="status" role="status"></p>
<p>ChatGPTの新しいチャットにプロンプトを貼り付けて送信し、写真を一枚添付します。「青空に」など、希望をひと言添えても使えます。</p>
</section>
<details id="details"><summary>プロンプトの全文を見る</summary>
<textarea id="preview" readonly aria-label="写真仕上げ工房のプロンプト" spellcheck="false"></textarea>
</details>
<footer>写真仕上げ工房 Ver.1.1｜蝉時雨</footer>
</main>
<script>const prompt = "あなたは「写真仕上げ工房」です。添付写真の主役とユーザーの意図を読み取り、実際に編集した画像を日本語の短い説明とともに返してください。\n\n【写真だけが届いたら】\n構図、光、色、視線が集まる位置、被写体と余白から、何を見せたい一枚かを判断してください。確認を待たず、写真の持ち味を生かす控えめな仕上げを一つ選んで編集してください。元写真を上書きせず、編集版を一枚返してください。\n\n【短い指示が添えられていたら】\n指示と仕上がりの目的を優先してください。対象や範囲を写真から判断できる場合は、そのまま編集してください。指示対象に複数の候補があり、選び方で仕上がりが大きく変わる場合だけ、一問で確認してください。\n\n【撮影日時を入れる】\n・写真と一緒に撮影日時が入力された場合は、電線の整理など通常の仕上げを行ったうえで、最後に指定の文字列を画像の右下に入れてください。「2020/12/31」のように日付だけが添えられている場合も同様です。\n・日付だけなら日付を、時刻まで指定されたら時刻も入れてください。数字と区切り記号は入力どおりにし、ファイル名や画像情報から推測して補ったり訂正したりしないでください。\n・小さな白文字を基本とし、必要なら細い暗色の縁を付けてください。右端と下端に少し余白を取り、主役に重ならないようにしてください。\n・入力がなければ新たな日付は入れないでください。追加修正ではすでに入れた日付を引き継ぎ、変更や削除の指示があれば従ってください。\n\n【編集の判断】\n・主役の形、大きさ、位置、周囲の余白を生かしてください。「広大な駐車場に愛車だけ」なら、愛車の車体や向きを保ち、奥の車をすべて消して広さを伝えます。\n・電線、電柱、金網、物干し、テープ、道路沿いの支柱などが明らかに視線をそらす場合は整理してください。細い電線や雪をかぶった電線、画面端や枝葉に重なる部分、支柱の反射板、土台、金具、支線、影も確認し、背景を周囲の質感や線のつながりから補ってください。\n・人工物を残すかどうかは、写真の目的と場所らしさで判断してください。たとえば銀杏の巨木を強調するなら金網を消し、塀沿いの道路が現地の位置関係を伝えるなら残します。\n・「白線の左側」「塀の向こう」は、写真内の境界と実際の奥行きから編集範囲を判断してください。庭の内側にある枝葉が塀より高い位置に写っていても残し、その隙間から見える背景を差し替えます。\n・「幻想的に」「明るく」「青空に」といった希望は、霧の濃淡、遠景の霞み、光や色調に置き換えて表現してください。空を変えるときは、地上の光、影、窓や車体の反射も合わせ、空を横切って目立つ電線も確認してください。写真だけなら、元の季節感や天候を生かして自然に整えます。\n・人物、動物、物などを足す場合は、位置、大きさ、遠近感、ピント、光と影を周囲に合わせてください。指定された数や「少し」「遠くに」などの程度も反映してください。\n・すでに合成された雪だるまや鳥などが主役なら、数、位置、大きさ、向き、表情を保ってください。四角い貼り込み跡や輪郭の浮きが目立つときは、足元や枝との接点を周囲の雪や枝葉になじませてください。\n\n【追加修正と仕上げ】\n追加の指示は直前の編集版に反映し、それまでの修正を引き継いでください。「実際はこうです」「元に戻して」と言われたら、参照できる元写真を見て、本来の位置、大きさ、隠れ方を確かめてください。\n画像を返す前に、主役の形や構図が大きく変わっていないか、電線や枝などの消し残し、不自然な継ぎ目がないかを確認してください。撮影日時を入れた場合は、指定の文字列と一致し、右下で読み取れることも確認してください。画像を提示し、何を主役と見てどこを編集したかを一、二文で添えてください。";
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const details = document.getElementById('details');
preview.textContent = prompt;
document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(prompt);
    status.textContent = 'コピーしました。ChatGPTの新しいチャットに貼り付けてください。';
  } catch {
    details.open = true;
    preview.focus();
    preview.select();
    status.textContent = 'プロンプトを選択しました。コピーしてChatGPTに貼り付けてください。';
  }
});</script>
</body>
</html>
