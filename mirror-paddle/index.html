<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>鏡面反射 — ボール＆パドル</title><meta name="description" content="ボール数・速さ・パドル幅を自由に調整。MAXモードでは、落ちないボールの反射をのんびり眺められます。"><style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#e8f0ee;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.eyebrow{color:#91b5b0;font-size:12px;letter-spacing:.2em}h1{font-size:30px;margin:8px 0;font-weight:600}header p{color:#9eafba;font-size:14px}.layout{display:grid;grid-template-columns:1fr 300px;gap:32px}.arena{display:flex;justify-content:center;background:#15232e;padding:16px;border-radius:20px;border:1px solid #30424e;position:relative}canvas{display:block;width:auto;height:min(72vh,740px);max-width:100%;aspect-ratio:420/720;touch-action:none;border-radius:6px}aside{padding:8px 0}h2{font-size:17px;margin:0 0 24px}label{display:flex;justify-content:space-between;align-items:center;margin:23px 0 10px;font-size:14px}output{color:#bce9cf;font-size:18px;font-variant-numeric:tabular-nums}input{width:100%;accent-color:#b4e7c7}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 12px;background:#b7e8ca;color:#132a23;font-weight:600;width:100%}button.secondary{background:#253945;color:#d6e4e9;margin-top:10px}button:disabled{opacity:.5;cursor:default}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}.stat{background:#1b2c37;padding:15px;border-radius:10px;color:#9fb1bd;font-size:12px}.stat strong{display:block;color:#f0f6f3;font-size:25px;margin-top:5px}.help{font-size:13px;line-height:1.9;color:#a8bac3;border-top:1px solid #30424e;padding-top:18px}.hint{font-size:12px;color:#8da5b1;margin:12px 0 24px;line-height:1.7}#status{color:#bce9cf;min-height:24px;font-size:14px}#sound{width:auto;background:none;color:#b0c5cc;font-size:13px;border:1px solid #405563;padding:8px 12px}@media(max-width:720px){main{padding:20px 14px}header{margin-bottom:16px}header p{display:none}h1{font-size:24px}.layout{grid-template-columns:1fr;gap:20px}canvas{height:62vh}.arena{padding:10px}aside{max-width:500px;width:100%;margin:auto}.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}label{display:block;margin-top:8px}output{display:block;margin-top:6px}.stats{margin:16px 0}}

/* Compact board: retain the physics aspect ratio, fit the whole playfield. */
main{max-width:890px;padding:18px 22px}header{margin-bottom:16px}h1{font-size:26px;margin:4px 0}header p{margin:4px 0;font-size:13px}.layout{grid-template-columns:minmax(240px,1fr) 310px;gap:24px;align-items:start}.arena{padding:12px;border-radius:15px}canvas{height:min(65vh,510px);height:min(65svh,510px);width:auto;max-width:100%}aside{padding:0}h2{margin:0 0 10px;font-size:16px}label{margin:12px 0 5px}output{font-size:16px}.hint{margin:7px 0 12px;font-size:11px;line-height:1.5}button{padding:10px 12px}button.secondary{margin-top:7px}.stats{margin:12px 0;gap:8px}.stat{padding:9px 12px}.stat strong{font-size:21px;margin-top:2px}.help{font-size:12px;line-height:1.65;padding-top:10px}.max-toggle{display:flex;align-items:center;gap:8px;margin:7px 0 0;font-size:13px;color:#c1d7ce}.max-toggle input{width:16px;height:16px;margin:0}.max-toggle small{color:#9bafb8;font-size:11px}
@media(max-width:650px){main{padding:12px}header{margin-bottom:10px}h1{font-size:22px}.layout{grid-template-columns:1fr;gap:14px}canvas{height:min(52svh,400px)}.arena{padding:8px}aside{max-width:470px}.settings{gap:12px}label{margin-top:6px;font-size:12px}output{margin-top:3px}.max-toggle{margin-top:9px}h2{display:none}.hint{font-size:11px}.help{font-size:11px}}
</style><main><header><div><div class="eyebrow">REFLECTION / 01</div><h1>鏡面反射</h1><p>小さなパドルで、ボールをつなぐ。</p></div><button id="sound" aria-pressed="false">音：オフ</button></header><div class="layout"><div class="arena"><canvas id="game" width="420" height="720" aria-label="縦長のボール反射ゲーム"></canvas></div><aside><h2>ボール＆パドル</h2><div id="status" role="status">設定を選んで、スタート。</div><div class="settings"><div><label for="count">投入ボール数 <output id="countO">3 個</output></label><input id="count" type="range" min="1" max="20" value="3"></div><div><label for="speed">ボールの速さ <output id="speedO">3</output></label><input id="speed" type="range" min="1" max="10" value="3"></div><div><label for="width">パドルの幅 <output id="widthO">100</output></label><input id="width" type="range" min="40" max="400" step="10" value="100"></div></div><label class="max-toggle"><input id="maxMode" type="checkbox">MAXモード <small>幅いっぱい・眺めるモード</small></label><p class="hint">ボール数は次のスタート時に反映。<br>速さとパドルの幅はプレイ中も変更できます。</p><button id="start">スタート</button><button id="pause" class="secondary" disabled>一時停止</button><div class="stats"><div class="stat">残りのボール<strong id="remaining">—</strong></div><div class="stat">パドルで反射<strong id="hits">0</strong></div><div class="stat">生存時間<strong id="time">0.0 秒</strong></div><div class="stat">最高記録（反射数）<strong id="best">0</strong></div></div><div class="help">マウス・指：盤面の上で左右に移動<br>キーボード：← → ／ A・D<br>スペース：一時停止・再開<br><br>左右の壁・天井・パドルでは、入射角と反射角が等しくなります。下の開口部に落ちたボールは戻りません。全て落ちると終了です。</div></aside></div></main><script>
const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d');const W=420,H=720,R=7,PY=665;let balls=[],px=W/2,state='ready',hits=0,elapsed=0,last=0,keys={},sound=false,audio,best=0;try{best=Number(localStorage.getItem('mirror-best'))||0}catch{}$('best').textContent=best;
function pw(){return +$('width').value}function velocity(){return 75+ +$('speed').value*45}function clamp(x){return Math.max(10+pw()/2,Math.min(W-10-pw()/2,x))}function sync(){for(const id of ['count','speed','width'])$(id+'O').textContent=(id==='width'&&+$(id).value===400)?'MAX':$(id).value+(id==='count'?' 個':'');$('maxMode').checked=+$('width').value===400;px=clamp(px)}for(const id of ['count','speed','width'])$(id).addEventListener('input',sync);sync();let previousWidth=100;$('maxMode').addEventListener('change',()=>{if($('maxMode').checked){previousWidth=+$('width').value;$('width').value=400}else{$('width').value=previousWidth<400?previousWidth:100}sync()});
function tone(freq){if(!sound)return;try{audio??=new AudioContext();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.08)}catch{}}
$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音：'+(sound?'オン':'オフ');$('sound').setAttribute('aria-pressed',sound);tone(500)};
function start(){balls=Array.from({length:+$('count').value},(_,i)=>{let angle=(i%2?1:-1)*(.3+Math.random()*.65);return{x:35+Math.random()*350,y:70+Math.random()*270,dx:Math.sin(angle),dy:Math.cos(angle),color:`hsl(${145+i*37%180} 75% 75%)`}});hits=0;elapsed=0;px=W/2;state='playing';$('start').textContent='最初からやり直す';$('pause').disabled=false;$('pause').textContent='一時停止';$('status').textContent='ボールを落とさず、つなぎましょう。';update()}
function pause(){if(!['playing','paused'].includes(state))return;state=state==='playing'?'paused':'playing';$('pause').textContent=state==='paused'?'再開':'一時停止';$('status').textContent=state==='paused'?'一時停止中':'ボールを落とさず、つなぎましょう。'}$('start').onclick=()=>{start();$('start').blur()};$('pause').onclick=()=>{pause();$('pause').blur()};
function update(){$('remaining').textContent=balls.length;$('hits').textContent=hits;$('time').textContent=elapsed.toFixed(1)+' 秒';if(hits>best){best=hits;$('best').textContent=best;try{localStorage.setItem('mirror-best',best)}catch{}}}
function pointer(e){const rect=c.getBoundingClientRect();px=clamp((e.clientX-rect.left)*W/rect.width)}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointer(e)});c.addEventListener('pointermove',pointer);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code)&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&!e.repeat)pause()}});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
function step(dt){if(keys.ArrowLeft||keys.KeyA)px=clamp(px-480*dt);if(keys.ArrowRight||keys.KeyD)px=clamp(px+480*dt);let distance=velocity()*dt,n=Math.max(1,Math.ceil(distance/3)),d=distance/n;for(let j=0;j<n;j++){for(let b of balls){let oldY=b.y;b.x+=b.dx*d;b.y+=b.dy*d;if(b.x<10+R){b.x=2*(10+R)-b.x;b.dx=Math.abs(b.dx);tone(280)}if(b.x>W-10-R){b.x=2*(W-10-R)-b.x;b.dx=-Math.abs(b.dx);tone(280)}if(b.y<10+R){b.y=2*(10+R)-b.y;b.dy=Math.abs(b.dy);tone(330)}if(b.dy>0&&oldY+R<=PY&&b.y+R>=PY){let t=(PY-R-oldY)/(b.y-oldY),ix=b.x-b.dx*d*(1-t);if(ix>=px-pw()/2&&ix<=px+pw()/2){b.y=2*(PY-R)-b.y;b.dy=-Math.abs(b.dy);hits++;tone(650)}}}balls=balls.filter(b=>b.y<H+R)}elapsed+=dt;update();if(!balls.length){state='over';$('pause').disabled=true;$('status').textContent='終了！ '+elapsed.toFixed(1)+'秒・'+hits+'回反射';$('start').textContent='もう一度遊ぶ'}}
function draw(){ctx.fillStyle='#0c161f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1d303d';ctx.lineWidth=1;for(let x=30;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,10);ctx.lineTo(x,H);ctx.stroke()}for(let y=30;y<H;y+=30){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(W-10,y);ctx.stroke()}ctx.strokeStyle='#68848c';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(7,H);ctx.lineTo(7,7);ctx.lineTo(W-7,7);ctx.lineTo(W-7,H);ctx.stroke();ctx.setLineDash([4,7]);ctx.strokeStyle='#754e54';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(12,H-12);ctx.lineTo(W-12,H-12);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#c7f0d4';ctx.shadowBlur=18;ctx.shadowColor='#a0dfbb';ctx.fillRect(px-pw()/2,PY,pw(),10);ctx.shadowBlur=0;for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0}if(state==='ready'||state==='paused'||state==='over'){ctx.fillStyle='#0c161fae';ctx.fillRect(11,200,W-22,230);ctx.textAlign='center';ctx.fillStyle='#e0f2e9';ctx.font='600 25px system-ui';ctx.fillText(state==='ready'?'準備はいいですか？':state==='paused'?'PAUSE':'GAME OVER',W/2,290);ctx.fillStyle='#9bb6c0';ctx.font='14px system-ui';ctx.fillText(state==='ready'?'設定で、自分の難易度に。':state==='paused'?'再開ボタンで続きをどうぞ':'もう一度、挑戦しましょう。',W/2,325)}}function frame(t){let dt=Math.min((t-last)/1000,.04);last=t;if(state==='playing')step(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
